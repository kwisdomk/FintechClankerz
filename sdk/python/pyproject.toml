[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-ai-client"
version = "0.1.0"
description = "Python integration client for the FINTECH AI audit API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0"]
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/kwisdomk/FintechClankerz"

[tool.setuptools.packages.find]
where = ["src"]
